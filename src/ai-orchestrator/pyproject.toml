[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ai-orchestrator"
version = "0.1.0"
description = "AI-specific workloads service for Enterprise GenAI Platform"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.118,<1",
    "uvicorn[standard]>=0.37,<1",
    "sentence-transformers>=6.1,<7",
]

[project.optional-dependencies]
dev = [
    "build>=1.3,<2",
    "mypy>=1.18,<2",
    "pytest>=8.4,<9",
    "httpx>=0.28.1,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_orchestrator"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "sentence_transformers",
    "sentence_transformers.*",
]
ignore_missing_imports = true