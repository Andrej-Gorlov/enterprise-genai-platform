services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18
    container_name: enterprise-genai-postgres

    environment:
      POSTGRES_DB: enterprise_genai
      POSTGRES_USER: enterprise_genai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enterprise_genai -d enterprise_genai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: